name: Build RPG Epic Fight Optimized

on:
  push:
    branches:
      - epic-fight-rpg-optimized
    paths:
      - 'epic-fight-rpg/**'
      - '.github/workflows/build-epic-fight-rpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate CurseForge pack
        run: |
          python epic-fight-rpg/build_pack.py
          python epic-fight-rpg/fix_dependencies.py

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          p=json.load(open('build/pack/manifest.json', encoding='utf-8'))
          assert p['minecraft']['version']=='1.20.1'
          assert p['minecraft']['modLoaders'][0]['id']=='forge-47.4.28'
          assert len(p['files'])==191
          keys={(x['projectID'],x['fileID']) for x in p['files']}
          assert len(keys)==191
          assert all(x['required'] for x in p['files'])
          projects={x['projectID']:x['fileID'] for x in p['files']}
          assert 665625 not in projects  # Epic ACG incompatible with Epic Fight 20.14.17
          assert projects[1286233]==8021301  # dacxirons 1.5.4
          assert projects[445274]==5435202   # Relics 0.6.5.2
          assert projects[474114]==8465155   # Huge Structure Blocks Forge 1.1.10
          assert projects[326652]==8889041   # Cupboard 4.2
          print('manifest FIX2 OK:', len(p['files']), 'unique entries')
          PY

      - name: Create importable CurseForge zip
        run: |
          mkdir -p dist
          cd build/pack
          zip -r ../../dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip manifest.json overrides OPTIMIZATION_NOTES.txt ADDED_MODS.html
          cd ../..
          unzip -t dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip

      - name: Commit pack
        run: |
          git config user.name "CastroSafio Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip
          if git diff --cached --quiet; then
            echo "Pack unchanged"
            exit 0
          fi
          git commit -m "Build RPG Epic Fight FULL COMPAT + MAX OPT FIX2"
          git push
