name: Build RPG Epic Fight Optimized

on:
  push:
    branches:
      - epic-fight-rpg-optimized
    paths:
      - 'epic-fight-rpg/**'
      - '.github/workflows/build-epic-fight-rpg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate CurseForge pack
        run: |
          python epic-fight-rpg/build_pack.py
          python epic-fight-rpg/fix_dependencies.py

      - name: Build CastroSafio Epic Fight Legacy Renderer Bridge
        run: |
          rm -rf build/legacy-bridge
          mkdir -p build/legacy-bridge build/pack/overrides/mods dist
          cp -R epic-fight-rpg/legacy-bridge/. build/legacy-bridge/
          (cd build/legacy-bridge && jar --create --file ../CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar .)
          cp build/CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar build/pack/overrides/mods/
          cp build/CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar dist/
          unzip -t build/CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar
          unzip -l build/CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar | grep 'META-INF/coremods.json'
          unzip -l build/CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar | grep 'coremods/castrosafio_epicfight_legacy_renderer_bridge.js'

      - name: Validate manifest and FIX6 bridge
        run: |
          python - <<'PY'
          import json, zipfile
          p=json.load(open('build/pack/manifest.json', encoding='utf-8'))
          assert p['minecraft']['version']=='1.20.1'
          assert p['minecraft']['modLoaders'][0]['id']=='forge-47.4.28'
          assert len(p['files'])==193
          keys={(x['projectID'],x['fileID']) for x in p['files']}
          assert len(keys)==193
          assert all(x['required'] for x in p['files'])
          projects={x['projectID']:x['fileID'] for x in p['files']}
          assert projects[665625]==8430532     # Epic ACG original
          assert projects[1737786]==9206668   # Epic ACG 20.14.17 compatibility bridge
          assert projects[1286233]==8021301   # dacxirons 1.5.4
          assert projects[445274]==7708970    # Relics 0.8.0.13 / OctoLib 0.5 compatible
          assert projects[474114]==8465155    # Huge Structure Blocks Forge 1.1.10
          assert projects[326652]==8889041    # Cupboard 4.2
          jar='build/CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar'
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              assert 'META-INF/coremods.json' in names
              assert 'META-INF/mods.toml' in names
              assert 'coremods/castrosafio_epicfight_legacy_renderer_bridge.js' in names
              toml=z.read('META-INF/mods.toml').decode()
              assert 'version="1.0.1"' in toml
              js=z.read('coremods/castrosafio_epicfight_legacy_renderer_bridge.js').decode()
              for required in [
                  'mainhandcorrectionMatrix',
                  'offhandCorrectionMatrix',
                  'EspadaOscuraRender',
                  'ClaymoreRender',
                  'MODERN_RENDER_DESC',
                  'LEGACY_RENDER_DESC',
                  'LEGACY_ADD_ITEM_RENDERER_DESC',
                  'addLegacyPatchedRenderersAddItemRenderer',
                  'castrosafio$legacyAddItemRenderer',
                  'PatchedRenderersEvent$Add',
                  'itemRendererMapByInstance'
              ]:
                  assert required in js, required
          print('manifest FIX6 OK:', len(p['files']), 'CurseForge entries + legacy renderer/item registration bridge 1.0.1')
          PY

      - name: Create importable CurseForge zip
        run: |
          rm -f dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip
          cd build/pack
          zip -r ../../dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip manifest.json overrides OPTIMIZATION_NOTES.txt ADDED_MODS.html
          cd ../..
          unzip -t dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip
          unzip -l dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip | grep 'CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar'

      - name: Commit pack
        run: |
          git config user.name "CastroSafio Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/RPG-EPIC-FIGHT-FULL-COMPAT-MAX-OPT-1.20.1.zip dist/CastroSafio-EpicFight-Legacy-Renderer-Bridge-1.0.1.jar
          if git diff --cached --quiet; then
            echo "Pack unchanged"
            exit 0
          fi
          git commit -m "Build RPG Epic Fight FULL COMPAT + MAX OPT FIX6 legacy item registration bridge"
          git push
