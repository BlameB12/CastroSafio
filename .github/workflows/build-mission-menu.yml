name: Build Fogata NeoForge 1.21.1

on:
  push:
    branches:
      - fogata-neoforge-1.21.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Restore original addon textures
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            base64 --decode "$file" > "${file%.b64}"
          done < <(find fogata/src/main/resources -type f -name '*.b64' -print0)

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fogata-y-Cucharas-NeoForge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
