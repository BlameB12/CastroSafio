name: Build CastroSafio Mission Menu

on:
  push:
    branches:
      - mission-menu-neoforge-1.21.1
      - mission-menu-op-admin-work4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CastroSafio-Menu-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
