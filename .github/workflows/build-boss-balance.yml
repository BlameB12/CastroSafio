name: Build CastroSafio Boss Balance

on:
  push:
    branches:
      - chatgpt-boss-balance-build
    paths:
      - 'boss-balance-build/**'
      - '.github/workflows/build-boss-balance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build NeoForge mod
        working-directory: boss-balance-build
        run: gradle build --stacktrace

      - name: Copy distributable JAR
        run: |
          mkdir -p dist
          JAR=$(find boss-balance-build/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)
          test -n "$JAR"
          cp "$JAR" dist/CastroSafio-Boss-Balance-1.21.1.jar
          unzip -t dist/CastroSafio-Boss-Balance-1.21.1.jar

      - name: Commit built JAR to build branch
        run: |
          git config user.name "CastroSafio Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f dist/CastroSafio-Boss-Balance-1.21.1.jar
          if git diff --cached --quiet; then
            echo "JAR unchanged"
            exit 0
          fi
          git commit -m "Build CastroSafio Boss Balance 1.21.1"
          git push
