name: Build CastroSafio Boss Controller

on:
  push:
    branches: [ boss-controller-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source and apply v0.2.2 files
        run: |
          rm -rf boss-controller
          mkdir boss-controller
          unzip -q boss-controller-source.zip -d boss-controller
          cp boss-controller-patches/BossControlManager.java boss-controller/src/main/java/com/castrosafio/bosscontroller/control/BossControlManager.java
          cp boss-controller-patches/BossClientEvents.java boss-controller/src/main/java/com/castrosafio/bosscontroller/client/BossClientEvents.java
          patch -d boss-controller -p1 < boss-controller-v012.patch
          patch -d boss-controller -p1 < boss-controller-v013.patch
          cp boss-controller-v014/BossNetwork.java boss-controller/src/main/java/com/castrosafio/bosscontroller/network/BossNetwork.java
          cp boss-controller-v015/BossClientEvents.java boss-controller/src/main/java/com/castrosafio/bosscontroller/client/BossClientEvents.java
          cp boss-controller-v015/BossControlManager.java boss-controller/src/main/java/com/castrosafio/bosscontroller/control/BossControlManager.java
          cp boss-controller-v015/BossActionPayload.java boss-controller/src/main/java/com/castrosafio/bosscontroller/network/BossActionPayload.java
          cp boss-controller-v018/IgnisActionController.java boss-controller/src/main/java/com/castrosafio/bosscontroller/control/IgnisActionController.java
          patch -d boss-controller -p1 < boss-controller-v019.patch
          patch -d boss-controller -p1 < boss-controller-v0110.patch
          cp boss-controller-v020/CataclysmBossActionController.java boss-controller/src/main/java/com/castrosafio/bosscontroller/control/CataclysmBossActionController.java
          patch -d boss-controller -p1 < boss-controller-v020.patch
          cp boss-controller-v021/CataclysmBossMovementBridge.java boss-controller/src/main/java/com/castrosafio/bosscontroller/control/CataclysmBossMovementBridge.java
          patch -d boss-controller -p1 < boss-controller-v021.patch
          patch -d boss-controller -p1 < boss-controller-v022.patch
          sed -i 's/^mod_version=.*/mod_version=0.2.2-beta/' boss-controller/gradle.properties

      - name: Build mod
        working-directory: boss-controller
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CastroSafio-Boss-Controller-1.21.1-v0.2.2
          path: boss-controller/build/libs/*.jar
          if-no-files-found: error
