name: Build Ofidia Boss

on:
  push:
    branches:
      - ofidia-boss-build
    paths:
      - 'ofidia-boss/**'
      - '.github/workflows/ofidia-boss-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build NeoForge mod
        working-directory: ofidia-boss
        run: gradle --no-daemon build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ofidia-Boss-NeoForge-1.21.1
          path: ofidia-boss/build/libs/*.jar
          if-no-files-found: error
