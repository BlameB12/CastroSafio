plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = '1.4.0'
group = 'com.castrosafio'

base {
    archivesName = 'CastroSafio-Menu-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java.srcDirs = ['modsrc/src/main/java']
        resources.srcDirs = ['modsrc/src/main/resources']
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.220'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
